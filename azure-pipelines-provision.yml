# Provisioning de un servidor nuevo para Lumina — corre UNA VEZ por VM,
# nunca automático (sin trigger). Pensado para VMs sin salida a internet:
# el agente (que sí tiene internet) descarga todos los instaladores en el
# workspace local, los empuja a la VM por WinRM, y recién ahí los instala.
#
# Idempotente: cada paso chequea si el recurso ya existe antes de instalar
# — correr esto de nuevo sobre una VM ya provisionada no debería romper
# nada (no reinstala Postgres si ya hay datos, no pisa el .env).
#
# TODO antes de correr: verificar que las versiones/URLs de descarga de
# abajo siguen vigentes (Node, PostgreSQL, URL Rewrite, ARR, NSSM cambian
# de versión con el tiempo) — están puestas como variables para ajustar
# fácil sin tocar la lógica de los steps.
#
# El .env real (DATABASE_URL, JWT_SECRET, ENCRYPTION_KEY, FRONTEND_URL) se
# sube UNA VEZ como Secure File en Pipelines > Library > Secure files
# (nombre esperado: el de `envSecureFileName` abajo) — nunca vive en el
# repo ni en el YAML. Este pipeline lo baja y lo copia a la VM, solo si
# todavía no existe ahí (no pisa un .env real en una VM ya en uso).
#
# Uso: Pipelines > este pipeline > Run pipeline > completar `targetVm` si
# es distinta a la de abajo.

trigger: none

pool:
  name: 'local-deploy-agent'

variables:
  targetVm: '192.168.180.155'
  deployRoot: 'C:\inetpub\lumina'
  iisSiteName: 'lumina'
  backendServiceName: 'lumina-backend'
  nodeVersion: '24.15.0'
  nodeMsiUrl: 'https://nodejs.org/dist/v$(nodeVersion)/node-v$(nodeVersion)-x64.msi'
  urlRewriteMsiUrl: 'https://download.microsoft.com/download/1/2/8/128E2E22-C1B9-44A4-BE2A-5859ED1D4592/rewrite_amd64_en-US.msi'
  arrMsiUrl: 'https://download.microsoft.com/download/E/9/8/E9849D6A-020E-47E4-9FD0-A023E99B54EB/requestRouter_amd64.msi'
  nssmZipUrl: 'https://nssm.cc/release/nssm-2.24.zip'
  pnpmExeUrl: 'https://github.com/pnpm/pnpm/releases/latest/download/pnpm-win-x64.exe'
  installerCacheDir: 'C:\_pipeline-cache\installers'   # persistente en el agente, entre runs
  # TODO: confirmar versión exacta vigente de PostgreSQL 17 antes de correr
  # (https://www.postgresql.org/download/windows/ -> EDB installer, Windows x64)
  postgresInstallerUrl: 'https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64.exe'
  postgresVersion: '17'
  # TODO: mover a variable secreta de Library en vez de texto plano acá.
  postgresSuperPassword: 'CAMBIAR_ESTA_PASSWORD'
  envSecureFileName: 'staging.env'   # nombre del Secure File subido en Library

stages:
  - stage: Provision
    displayName: 'Provisionar VM nueva'
    jobs:
      - job: Provision
        displayName: 'Descargar instaladores + instalar en la VM (WinRM)'
        steps:
          - checkout: none

          - task: DownloadSecureFile@1
            name: envFile
            displayName: 'Descargar .env real desde Library (Secure files)'
            inputs:
              secureFile: '$(envSecureFileName)'

          - powershell: |
              # Cache persistente entre runs (no Agent.TempDirectory, que se
              # limpia cada vez) - si el instalador ya está bajado, lo reusa.
              New-Item -ItemType Directory -Path "$(installerCacheDir)" -Force | Out-Null
              $files = @{
                'node.msi'       = '$(nodeMsiUrl)'
                'urlrewrite.msi' = '$(urlRewriteMsiUrl)'
                'arr.msi'        = '$(arrMsiUrl)'
                'nssm.zip'       = '$(nssmZipUrl)'
                'postgres.exe'   = '$(postgresInstallerUrl)'
              }
              foreach ($f in $files.GetEnumerator()) {
                $dest = "$(installerCacheDir)\$($f.Key)"
                if (Test-Path $dest) {
                  Write-Host "$($f.Key) ya está en cache, no lo bajo de nuevo."
                } else {
                  Write-Host "Descargando $($f.Key)..."
                  $attempt = 0
                  do {
                    $attempt++
                    try {
                      Invoke-WebRequest -Uri $f.Value -OutFile $dest -UseBasicParsing -TimeoutSec 120
                      break
                    } catch {
                      Write-Host "Intento $attempt fallo: $($_.Exception.Message)"
                      if ($attempt -ge 3) { throw }
                      Start-Sleep -Seconds 5
                    }
                  } while ($attempt -lt 3)
                }
              }
              # pnpm: no se descarga — se copia el .exe REAL del store del
              # agente (no el shim de Get-Command, que es un .cmd con
              # junctions/paths relativos que no sobreviven una copia).
              # OJO: el .exe es un Node SEA (single executable app) — necesita
              # su carpeta `dist\` (pnpm.mjs, worker.js, vendor) AL LADO. Copiar
              # solo el .exe rompe en runtime con "Cannot find module
              # 'dist\pnpm.mjs'". Se copia la carpeta completa, no solo el .exe.
              $realPnpmExe = Get-ChildItem "$env:LOCALAPPDATA\pnpm" -Recurse -Filter 'pnpm.exe' -Force -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
              if (-not $realPnpmExe) { throw "No se encontro el pnpm.exe real en el agente — no se puede provisionar sin eso" }
              $realPnpmDir = Split-Path $realPnpmExe -Parent
              Remove-Item "$(installerCacheDir)\pnpm-exe" -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path "$(installerCacheDir)\pnpm-exe\dist" -Force | Out-Null
              Copy-Item "$realPnpmDir\pnpm.exe" "$(installerCacheDir)\pnpm-exe\pnpm.exe" -Force
              Copy-Item "$realPnpmDir\dist\*" "$(installerCacheDir)\pnpm-exe\dist" -Recurse -Force

              Write-Host "Instaladores listos en $(installerCacheDir)"
            displayName: 'Descargar instaladores (agente, con cache persistente)'

          - powershell: |
              $session = New-PSSession -ComputerName '$(targetVm)'
              try {
                # Carpeta de trabajo remota para los instaladores
                Invoke-Command -Session $session -ScriptBlock {
                  New-Item -ItemType Directory -Path 'C:\_provision' -Force | Out-Null
                }
                Copy-Item "$(installerCacheDir)\*" 'C:\_provision' -ToSession $session -Recurse -Force

                # ── IIS (feature de Windows, no necesita descarga) ──
                Invoke-Command -Session $session -ScriptBlock {
                  if (-not (Get-Service W3SVC -ErrorAction SilentlyContinue)) {
                    Write-Output "Instalando IIS..."
                    Install-WindowsFeature -Name Web-Server, Web-Common-Http, Web-Default-Doc, Web-Static-Content, Web-Http-Errors -IncludeManagementTools
                  } else {
                    Write-Output "IIS ya estaba instalado, salteando."
                  }
                }

                # ── URL Rewrite ──
                Invoke-Command -Session $session -ScriptBlock {
                  $installed = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                    Where-Object { $_.DisplayName -like 'IIS URL Rewrite*' }
                  if (-not $installed) {
                    Write-Output "Instalando URL Rewrite..."
                    Start-Process msiexec.exe -ArgumentList '/i C:\_provision\urlrewrite.msi /quiet /norestart' -Wait
                  } else {
                    Write-Output "URL Rewrite ya estaba instalado, salteando."
                  }
                }

                # ── Application Request Routing ──
                Invoke-Command -Session $session -ScriptBlock {
                  $installed = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                    Where-Object { $_.DisplayName -like 'Application Request Routing*' }
                  if (-not $installed) {
                    Write-Output "Instalando ARR..."
                    Start-Process msiexec.exe -ArgumentList '/i C:\_provision\arr.msi /quiet /norestart' -Wait
                  } else {
                    Write-Output "ARR ya estaba instalado, salteando."
                  }
                }

                # ── Habilitar el proxy de ARR (paso que ya nos mordió en QA) ──
                Invoke-Command -Session $session -ScriptBlock {
                  Import-Module WebAdministration -ErrorAction SilentlyContinue
                  Set-WebConfigurationProperty -Filter "system.webServer/proxy" -PSPath "IIS:\" -Name "enabled" -Value $true
                  Write-Output "Proxy de ARR habilitado."
                }

                # ── Node.js ──
                Invoke-Command -Session $session -ScriptBlock {
                  $existing = Get-Command node -ErrorAction SilentlyContinue
                  if (-not $existing) {
                    Write-Output "Instalando Node.js..."
                    Start-Process msiexec.exe -ArgumentList '/i C:\_provision\node.msi /quiet /norestart' -Wait
                    $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine')
                  } else {
                    Write-Output "Node ya estaba instalado ($(node --version)), salteando."
                  }
                }

                # ── pnpm (.exe real + carpeta dist/ copiados del agente — la VM
                #    no tiene internet, `npm install -g pnpm` ahí nunca funciona;
                #    el .exe es un Node SEA, necesita dist\pnpm.mjs al lado) ──
                Invoke-Command -Session $session -ScriptBlock {
                  $pnpmOk = (Test-Path 'C:\pnpm\pnpm.exe') -and (Test-Path 'C:\pnpm\dist\pnpm.mjs')
                  if (-not $pnpmOk) {
                    Write-Output "Instalando pnpm (.exe + dist/)..."
                    # Por si quedó una instalación previa incompleta (solo el
                    # .exe, sin dist/) de una corrida vieja — se limpia y se
                    # copia todo de nuevo en vez de confiar en lo que haya.
                    Remove-Item 'C:\pnpm' -Recurse -Force -ErrorAction SilentlyContinue
                    New-Item -ItemType Directory -Path 'C:\pnpm\dist' -Force | Out-Null
                    Copy-Item 'C:\_provision\pnpm-exe\pnpm.exe' 'C:\pnpm\pnpm.exe' -Force
                    Copy-Item 'C:\_provision\pnpm-exe\dist\*' 'C:\pnpm\dist' -Recurse -Force
                    $machinePath = [System.Environment]::GetEnvironmentVariable('Path','Machine')
                    if ($machinePath -notlike '*C:\pnpm*') {
                      [System.Environment]::SetEnvironmentVariable('Path', "$machinePath;C:\pnpm", 'Machine')
                    }
                  } else {
                    Write-Output "pnpm ya estaba instalado (.exe + dist/ OK), salteando."
                  }
                }

                # ── PostgreSQL ──
                Invoke-Command -Session $session -ScriptBlock {
                  param($pgVersion, $superPassword)
                  $svc = Get-Service -Name "postgresql-x64-$pgVersion" -ErrorAction SilentlyContinue
                  if (-not $svc) {
                    Write-Output "Instalando PostgreSQL $pgVersion..."
                    # --unattendedmodeui minimal + password fija temporal (CAMBIAR después
                    # del provisioning, esto no debe quedar así en un ambiente real).
                    Start-Process 'C:\_provision\postgres.exe' -ArgumentList @(
                      '--mode', 'unattended',
                      '--unattendedmodeui', 'minimal',
                      '--superpassword', $superPassword,
                      '--servicename', "postgresql-x64-$pgVersion"
                    ) -Wait
                    $svc = Get-Service -Name "postgresql-x64-$pgVersion" -ErrorAction SilentlyContinue
                  } else {
                    Write-Output "PostgreSQL ya estaba instalado ($($svc.Name)), salteando."
                  }
                  # Ya nos pasó en QA que el servicio quedó en Manual y con eso
                  # tirado el backend después de un reboot — forzar Automatic
                  # siempre, instale o no instale esta corrida.
                  if ($svc -and $svc.StartType -ne 'Automatic') {
                    Set-Service -Name "postgresql-x64-$pgVersion" -StartupType Automatic
                    Write-Output "PostgreSQL: StartupType forzado a Automatic."
                  }
                } -ArgumentList '$(postgresVersion)', '$(postgresSuperPassword)'

                # ── NSSM ──
                Invoke-Command -Session $session -ScriptBlock {
                  if (-not (Test-Path 'C:\nssm\nssm.exe')) {
                    Write-Output "Instalando NSSM..."
                    Expand-Archive -Path 'C:\_provision\nssm.zip' -DestinationPath 'C:\_provision\nssm-extract' -Force
                    New-Item -ItemType Directory -Path 'C:\nssm' -Force | Out-Null
                    Copy-Item 'C:\_provision\nssm-extract\nssm-2.24\win64\nssm.exe' 'C:\nssm\nssm.exe' -Force
                  } else {
                    Write-Output "NSSM ya estaba instalado, salteando."
                  }
                }

                # ── Estructura de carpetas de la app ──
                Invoke-Command -Session $session -ScriptBlock {
                  param($deployRoot)
                  New-Item -ItemType Directory -Path "$deployRoot\apps\frontend\dist" -Force | Out-Null
                  New-Item -ItemType Directory -Path "$deployRoot\apps\backend\src" -Force | Out-Null
                  New-Item -ItemType Directory -Path "$deployRoot\apps\backend\prisma" -Force | Out-Null
                  New-Item -ItemType Directory -Path "$deployRoot\_backups" -Force | Out-Null
                } -ArgumentList '$(deployRoot)'

                # ── .env real (bajado como Secure File arriba) ──
                # Solo si no existe ya en la VM — nunca pisa un .env real
                # de una VM que ya está en uso.
                $envExists = Invoke-Command -Session $session -ScriptBlock {
                  param($deployRoot)
                  Test-Path "$deployRoot\apps\backend\.env"
                } -ArgumentList '$(deployRoot)'
                if (-not $envExists) {
                  Write-Output "Copiando .env a la VM..."
                  Copy-Item "$(envFile.secureFilePath)" "$(deployRoot)\apps\backend\.env" -ToSession $session -Force
                } else {
                  Write-Output ".env ya existe en la VM, no lo piso."
                }

                # ── DB + usuario de la app en Postgres ──
                # El .env trae DATABASE_URL apuntando a un user/db que Postgres
                # todavía no tiene (el instalador solo crea el superusuario) —
                # sin esto el backend arranca pero no puede conectar. Se lee el
                # DATABASE_URL real de la VM (no el de acá) por si ya existía
                # un .env propio, y se crea el rol/db solo si faltan (idempotente).
                Invoke-Command -Session $session -ScriptBlock {
                  param($pgVersion, $superPassword, $deployRoot)

                  $envContent = Get-Content "$deployRoot\apps\backend\.env" -Raw
                  if ($envContent -notmatch 'DATABASE_URL\s*=\s*"?([^"\r\n]+)"?') {
                    throw "No se encontro DATABASE_URL en $deployRoot\apps\backend\.env"
                  }
                  $dbUrl = $Matches[1]
                  if ($dbUrl -notmatch 'postgres(?:ql)?://([^:]+):([^@]+)@[^/]+/([^?"\s]+)') {
                    throw "No se pudo parsear DATABASE_URL (formato inesperado): $dbUrl"
                  }
                  $dbUser = $Matches[1]
                  $dbPass = $Matches[2]
                  $dbName = $Matches[3]

                  $psql = Get-ChildItem "C:\Program Files\PostgreSQL\$pgVersion" -Recurse -Filter 'psql.exe' -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
                  if (-not $psql) { throw "No se encontro psql.exe (instalacion de Postgres $pgVersion incompleta?)" }

                  $env:PGPASSWORD = $superPassword
                  try {
                    # 2>&1 + join a string: si psql no puede conectar (password
                    # del superusuario no coincide, servidor no responde, etc.)
                    # el output queda $null y un .Trim() sobre eso revienta con
                    # "cannot call a method on a null-valued expression" sin
                    # decir por qué — se chequea el exit code explícito y se
                    # muestra el error real de psql (p.ej. auth failed).
                    $roleExists = (& $psql -U postgres -h localhost -tAc "SELECT 1 FROM pg_roles WHERE rolname='$dbUser'" 2>&1) -join "`n"
                    if ($LASTEXITCODE -ne 0) {
                      throw "psql fallo chequeando el rol '$dbUser' (exit $LASTEXITCODE): $roleExists"
                    }
                    if ($roleExists.Trim() -ne '1') {
                      Write-Output "Creando rol '$dbUser' en Postgres..."
                      $passEscaped = $dbPass.Replace("'", "''")
                      $createOut = (& $psql -U postgres -h localhost -c "CREATE ROLE `"$dbUser`" LOGIN PASSWORD '$passEscaped';" 2>&1) -join "`n"
                      if ($LASTEXITCODE -ne 0) { throw "psql fallo creando el rol '$dbUser' (exit $LASTEXITCODE): $createOut" }
                    } else {
                      Write-Output "Rol '$dbUser' ya existe, salteando."
                    }

                    $dbExists = (& $psql -U postgres -h localhost -tAc "SELECT 1 FROM pg_database WHERE datname='$dbName'" 2>&1) -join "`n"
                    if ($LASTEXITCODE -ne 0) {
                      throw "psql fallo chequeando la base '$dbName' (exit $LASTEXITCODE): $dbExists"
                    }
                    if ($dbExists.Trim() -ne '1') {
                      Write-Output "Creando base '$dbName' (owner '$dbUser')..."
                      $createDbOut = (& $psql -U postgres -h localhost -c "CREATE DATABASE `"$dbName`" OWNER `"$dbUser`";" 2>&1) -join "`n"
                      if ($LASTEXITCODE -ne 0) { throw "psql fallo creando la base '$dbName' (exit $LASTEXITCODE): $createDbOut" }
                    } else {
                      Write-Output "Base '$dbName' ya existe, salteando."
                    }
                  } finally {
                    Remove-Item Env:\PGPASSWORD -ErrorAction SilentlyContinue
                  }
                } -ArgumentList '$(postgresVersion)', '$(postgresSuperPassword)', '$(deployRoot)'

                # ── Sitio IIS ──
                Invoke-Command -Session $session -ScriptBlock {
                  param($siteName, $deployRoot)
                  Import-Module WebAdministration -ErrorAction SilentlyContinue
                  if (-not (Get-Website -Name $siteName -ErrorAction SilentlyContinue)) {
                    Write-Output "Creando sitio IIS $siteName..."
                    New-Website -Name $siteName -PhysicalPath "$deployRoot\apps\frontend\dist" -Port 8090
                  } else {
                    Write-Output "Sitio IIS $siteName ya existe, salteando."
                  }
                } -ArgumentList '$(iisSiteName)', '$(deployRoot)'

                # ── Servicio NSSM del backend ──
                Invoke-Command -Session $session -ScriptBlock {
                  param($svc, $deployRoot)
                  if (-not (Get-Service -Name $svc -ErrorAction SilentlyContinue)) {
                    Write-Output "Registrando servicio $svc..."
                    & 'C:\nssm\nssm.exe' install $svc "$(where.exe node)" "$deployRoot\apps\backend\src\index.js"
                    & 'C:\nssm\nssm.exe' set $svc AppDirectory "$deployRoot\apps\backend"
                    & 'C:\nssm\nssm.exe' set $svc Start SERVICE_AUTO_START
                  } else {
                    Write-Output "Servicio $svc ya existe, salteando (no lo reconfiguro por las dudas)."
                  }
                } -ArgumentList '$(backendServiceName)', '$(deployRoot)'

                Write-Output "=== Provisioning terminado ==="
                Write-Output "PENDIENTE MANUAL: crear apps\backend\.env en la VM con DATABASE_URL,"
                Write-Output "JWT_SECRET, ENCRYPTION_KEY, FRONTEND_URL antes del primer deploy."
                Write-Output "PENDIENTE MANUAL: cambiar la password de Postgres puesta arriba."
              } finally {
                Invoke-Command -Session $session -ScriptBlock { Remove-Item 'C:\_provision' -Recurse -Force -ErrorAction SilentlyContinue }
                Remove-PSSession $session
              }
            displayName: 'Instalar todo en la VM (idempotente, vía WinRM)'
