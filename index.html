<!DOCTYPE html>
<html lang="es" data-mode="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1640"/>
<title>AntuNexus — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* AntuNexus Design System - Base styles */
:root {
  /* Neutrals — warm, low saturation */
  --ink-1: oklch(0.18 0.015 70);   /* strongest text */
  --ink-2: oklch(0.32 0.012 70);
  --ink-3: oklch(0.48 0.010 70);
  --ink-4: oklch(0.62 0.008 70);   /* subtle labels */
  --line: oklch(0.90 0.006 70);
  --line-2: oklch(0.94 0.005 70);
  --paper: oklch(0.985 0.003 75);  /* bg */
  --paper-2: oklch(0.97 0.004 75); /* alt bg */
  --paper-3: oklch(0.94 0.005 75);
  --white: oklch(1 0 0);

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-pill: 999px;

  /* Fonts */
  --font-sans: "Inter Tight", "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
  --font-serif: "Instrument Serif", Georgia, serif;

  /* Per-app colors (defaults, overridden by JS) */
  --accent: oklch(0.70 0.15 65);
  --accent-deep: oklch(0.55 0.16 55);
  --accent-soft: oklch(0.95 0.04 75);
  --accent-ink: oklch(0.28 0.08 55);
}

:root[data-mode="dark"] {
  --ink-1: oklch(0.98 0.005 75);
  --ink-2: oklch(0.85 0.008 70);
  --ink-3: oklch(0.68 0.008 70);
  --ink-4: oklch(0.52 0.010 70);
  --line: oklch(0.22 0.012 70);
  --line-2: oklch(0.18 0.010 70);
  --paper: oklch(0.14 0.010 70);
  --paper-2: oklch(0.17 0.012 70);
  --paper-3: oklch(0.20 0.013 70);
  --white: oklch(0.22 0.012 70);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: var(--font-sans);
  font-feature-settings: "ss01", "cv11";
  color: var(--ink-1);
  background: var(--paper-2);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.011em;
  line-height: 1.45;
}
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* Scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

/* Utility */
.mono { font-family: var(--font-mono); letter-spacing: -0.01em; }
.serif { font-family: var(--font-serif); letter-spacing: -0.02em; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-4);
  font-weight: 500;
}

/* App-page shell */
.page {
  min-height: 100vh;
  background: var(--paper-2);
  color: var(--ink-1);
}

/* Generic card */
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
}

/* Placeholder imagery — striped SVG-esque */
.ph {
  background:
    repeating-linear-gradient(135deg,
      oklch(0.94 0.006 75) 0 8px,
      oklch(0.97 0.004 75) 8px 16px);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  color: var(--ink-4);
  font-size: 11px;
  letter-spacing: 0.03em;
}

/* Device frames */
.frame-mobile {
  width: 320px;
  height: 640px;
  border-radius: 36px;
  border: 8px solid oklch(0.18 0.010 70);
  background: var(--paper);
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 60px -20px oklch(0.20 0.02 70 / 0.25),
              0 10px 20px -8px oklch(0.20 0.02 70 / 0.10);
}
.frame-tablet {
  width: 520px;
  height: 700px;
  border-radius: 24px;
  border: 10px solid oklch(0.18 0.010 70);
  background: var(--paper);
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 60px -20px oklch(0.20 0.02 70 / 0.25),
              0 10px 20px -8px oklch(0.20 0.02 70 / 0.10);
}
.frame-desktop {
  width: 960px;
  height: 620px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--paper);
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 60px -20px oklch(0.20 0.02 70 / 0.20),
              0 10px 20px -8px oklch(0.20 0.02 70 / 0.08);
}

/* Desktop chrome */
.chrome-bar {
  height: 34px;
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 8px;
}
.chrome-dots { display: flex; gap: 6px; }
.chrome-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--line); }
.chrome-url {
  flex: 1;
  margin: 0 80px 0 20px;
  height: 22px;
  background: var(--paper);
  border-radius: 6px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
}

/* Status bar iPhone-ish */
.statusbar {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-1);
}
.statusbar-right { display: flex; gap: 5px; align-items: center; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 14px;
  border-radius: var(--r-md);
  font-weight: 500;
  font-size: 14px;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: oklch(0.12 0.015 var(--accent-hue, 65));
  color: #fff;
}
.btn-primary:hover { background: var(--accent-deep); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--paper-3); }
.btn-outline {
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-1);
}
.btn-outline:hover { border-color: var(--ink-4); }

/* Focus */
button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Transitions */
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* Hide scrollbar inside mockups */
.hide-scroll::-webkit-scrollbar { display: none; }
.hide-scroll { scrollbar-width: none; }

/* AntuNexus — prototype-specific styles */

/* ---------- Main shell / canvas ---------- */
.proto-canvas {
  min-height: 100vh;
  background: var(--paper-2);
  padding: 28px 32px 80px;
  color: var(--ink-1);
}
.proto-head {
  max-width: 1680px;
  margin: 0 auto 28px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}
.proto-head-left { display: flex; align-items: center; gap: 12px; }
.proto-head-right { display: flex; align-items: center; gap: 8px; }
.proto-nav {
  display: inline-flex;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  padding: 3px;
}
.proto-nav button {
  padding: 7px 14px;
  border-radius: var(--r-pill);
  font-size: 13px;
  color: var(--ink-3);
  font-weight: 500;
}
.proto-nav button.active {
  background: var(--ink-1);
  color: var(--paper);
}

/* ---------- DS showcase ---------- */
.ds-showcase { max-width: 1680px; margin: 0 auto; }
.ds-hero {
  background: linear-gradient(180deg, var(--paper), var(--paper-2));
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 48px 48px 36px;
  margin-bottom: 40px;
  overflow: hidden;
  position: relative;
}
.ds-hero::before {
  content: "";
  position: absolute;
  right: -120px;
  top: -120px;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: radial-gradient(circle, oklch(0.85 0.12 65 / 0.35), transparent 70%);
  filter: blur(10px);
}
.ds-hero-inner { position: relative; max-width: 780px; }
.ds-hero-title {
  font-family: var(--font-serif);
  font-size: 60px;
  line-height: 1.02;
  letter-spacing: -0.03em;
  margin: 12px 0 16px;
  font-weight: 400;
}
.ds-hero-title .serif { font-style: italic; }
.ds-hero-sub {
  font-size: 17px;
  color: var(--ink-2);
  line-height: 1.55;
  max-width: 640px;
}
.ds-hero-apps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-top: 36px;
}
.ds-hero-app {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.ds-hero-app-name { font-size: 14px; font-weight: 500; }
.ds-hero-app-cat { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); text-transform: uppercase; letter-spacing: 0.04em; }

/* Sections */
.ds-section { padding: 36px 0; }
.ds-section.alt { background: var(--paper); border-radius: var(--r-xl); padding: 36px; margin: 24px 0; border: 1px solid var(--line); }
.ds-section-head { max-width: 720px; margin-bottom: 28px; }
.ds-section-title {
  font-family: var(--font-serif);
  font-size: 36px;
  letter-spacing: -0.02em;
  font-weight: 400;
  margin: 6px 0 10px;
}
.ds-section-sub { color: var(--ink-2); font-size: 15px; line-height: 1.5; }

/* Swatches */
.swatch-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.swatch-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
.swatch-stack { display: flex; flex-direction: column; }
.swatch {
  padding: 14px 16px;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 52px;
}
.swatch-hue { opacity: 0.8; }
.swatch-meta { display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.swatch-name { font-size: 13px; font-weight: 500; }
.swatch-cat { font-size: 10.5px; color: var(--ink-4); text-transform: uppercase; letter-spacing: 0.04em; }
.neutral-row { margin-top: 28px; }
.neutral-bar { display: grid; grid-template-columns: repeat(9, 1fr); margin-top: 8px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); }
.neutral-cell { height: 64px; display: flex; align-items: flex-end; padding: 8px; font-size: 11px; }

/* Type */
.type-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; }
.type-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 24px; }
.type-card > *:not(:last-child) { margin-bottom: 12px; }

/* Components */
.components-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.comp-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.comp-card-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); background: var(--paper-2); }
.comp-card-name { font-size: 11px; color: var(--ink-3); }
.comp-card-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.comp-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  font-size: 11.5px;
  font-weight: 500;
}
.chip-dot { background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip-dot-mark { width: 6px; height: 6px; border-radius: 999px; }
.comp-input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  height: 36px;
  color: var(--ink-4);
}
.comp-input-wrap input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-size: 13px;
  color: var(--ink-1);
}
.comp-input-wrap input::placeholder { color: var(--ink-4); }
.comp-input-kbd {
  font-size: 10px;
  padding: 2px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  color: var(--ink-3);
}
.comp-tabs { display: flex; gap: 14px; border-bottom: 1px solid var(--line-2); }
.tab { padding: 8px 0; font-size: 13px; color: var(--ink-3); border-bottom: 2px solid transparent; }
.tab-active { color: var(--ink-1); border-bottom-color: currentColor; font-weight: 500; }

/* Tokens (spacing/radius/shadow) */
.tokens-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tokens-card { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; }
.space-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.space-row { display: flex; align-items: center; gap: 12px; height: 18px; }
.space-bar { height: 8px; background: oklch(0.85 0.12 65); border-radius: 3px; }
.radius-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 12px; }
.radius-item { text-align: center; }
.radius-box { height: 48px; background: oklch(0.88 0.10 65); margin-bottom: 6px; }
.shadow-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.shadow-item { text-align: center; }
.shadow-box { height: 52px; background: var(--paper); border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--line-2); }

/* ---------- Device grid (prototype view) ---------- */
.device-grid {
  display: flex;
  gap: 32px;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  max-width: 1680px;
  margin: 0 auto;
}
.device-label {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 12px;
}
.device-wrap { display: flex; flex-direction: column; align-items: center; }

/* ---------- Mobile screens ---------- */
.m-screen {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--paper);
}
.m-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 18px 10px;
  gap: 10px;
}
.m-avatar {
  width: 30px; height: 30px;
  border-radius: 999px;
  background: var(--accent, oklch(0.70 0.15 65));
  color: #fff;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600;
}
.m-back { color: var(--ink-2); padding: 4px; }
.m-body { flex: 1; }

.m-bottomnav {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 8px 8px 14px;
  background: var(--paper);
  border-top: 1px solid var(--line-2);
}
.m-nav-btn {
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  padding: 4px;
  color: var(--ink-4);
}
.m-nav-btn.active { color: var(--accent, var(--ink-1)); }
.m-nav-icon { position: relative; }
.m-nav-badge {
  position: absolute;
  top: -4px; right: -8px;
  background: oklch(0.6 0.18 25);
  color: #fff;
  font-size: 9px;
  min-width: 14px;
  height: 14px;
  border-radius: 999px;
  display: grid; place-items: center;
  padding: 0 3px;
  font-weight: 600;
}
.m-nav-lbl { font-size: 10px; }

.hub-apps { padding: 4px 14px 0; display: flex; flex-direction: column; gap: 8px; }
.hub-app-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--ink-1);
  transition: all 0.15s;
}
.hub-app-card:hover { border-color: var(--accent); background: var(--paper-2); }
.hub-activity {
  display: flex; gap: 10px; align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-2);
}
.hub-activity:last-child { border-bottom: none; }

.m-tab {
  padding: 8px 0;
  font-size: 13px;
  border-bottom: 2px solid transparent;
  text-transform: capitalize;
  font-weight: 500;
}

.progress {
  height: 6px;
  background: var(--paper-3);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }

.stat-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
  color: var(--ink-3);
}
.stat-num { font-size: 22px; font-weight: 600; color: var(--ink-1); letter-spacing: -0.02em; margin-top: 4px; }
.stat-lbl { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); text-transform: uppercase; letter-spacing: 0.04em; }

.ord-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; }

.reserva-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
}
.reserva-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  display: grid; place-items: center;
}

.kpi {
  padding: 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  text-align: left;
}
.kpi-n { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.kpi-l { font-family: var(--font-mono); font-size: 10px; color: var(--ink-4); text-transform: uppercase; }

.pim-list { display: flex; flex-direction: column; }
.pim-item {
  display: flex; gap: 12px; align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line-2);
}
.pim-mini-bar {
  height: 4px;
  background: var(--paper-3);
  border-radius: 999px;
  margin-top: 4px;
  overflow: hidden;
  width: 100%;
}

/* ---------- Tablet (Telita) ---------- */
.tb-screen {
  display: grid;
  grid-template-columns: 180px 1fr;
  height: 100%;
  background: var(--paper-2);
}
.tb-side { background: var(--paper); border-right: 1px solid var(--line); }
.tb-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--ink-3);
  border-left: 2px solid transparent;
}
.tb-nav-item.active { color: var(--ink-1); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.tb-main { padding: 20px; overflow-y: auto; }
.tb-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }

/* ---------- Desktop ---------- */
.dk-screen {
  display: grid;
  grid-template-columns: 210px 1fr;
  height: 100%;
  background: var(--paper-2);
}
.dk-side { background: var(--paper); border-right: 1px solid var(--line); overflow-y: auto; }
.dk-nav-section {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 14px 16px 4px;
}
.dk-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  font-size: 13px;
  color: var(--ink-3);
  border-left: 2px solid transparent;
  cursor: pointer;
}
.dk-nav-item.active { color: var(--ink-1); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.dk-nav-item:hover:not(.active) { background: var(--paper-2); color: var(--ink-1); }
.dk-main { padding: 22px; overflow-y: auto; }
.dk-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }
.dk-breadcrumb { font-size: 11px; color: var(--ink-4); }

.pim-table { overflow: hidden; }
.pim-th, .pim-tr {
  display: flex;
  gap: 12px;
  padding: 12px 16px;
  align-items: center;
}
.pim-th {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--ink-4);
  text-transform: uppercase;

// Simple fake chart (SVG ok — just lines/rects)
function FakeChart({ hue = 65, accent, bars }) {
  const points = [22, 34, 28, 46, 40, 58, 52];
  const w = 320, h = 140, pad = 10;
  if (bars) {
    return (
      <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ marginTop: 6 }}>
        {points.map((p, i) => {
          const bh = (p / 70) * (h - pad * 2);
          const x = pad + i * ((w - pad * 2) / 7);
          return (
            <g key={i}>
              <rect x={x + 4} y={h - pad - (bh - 4)} width={18} height={bh - 4} fill={accent} rx="2" opacity="0.25"/>
              <rect x={x + 4} y={h - pad - bh * 0.75} width={18} height={bh * 0.75} fill={accent} rx="2"/>
            </g>
          );
        })}
      </svg>
    );
  }
  const path = points.map((p, i) => {
    const x = pad + i * ((w - pad * 2) / (points.length - 1));
    const y = h - pad - (p / 70) * (h - pad * 2);
    return `${i === 0 ? "M" : "L"} ${x} ${y}`;
  }).join(" ");
  const area = path + ` L ${w - pad} ${h - pad} L ${pad} ${h - pad} Z`;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ marginTop: 6 }}>
      <defs>
        <linearGradient id={"g" + hue} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={accent} stopOpacity="0.25"/>
          <stop offset="100%" stopColor={accent} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#g${hue})`}/>
      <path d={path} fill="none" stroke={accent} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {points.map((p, i) => {
        const x = pad + i * ((w - pad * 2) / (points.length - 1));
        const y = h - pad - (p / 70) * (h - pad * 2);
        return <circle key={i} cx={x} cy={y} r="3" fill={accent}/>;
      })}
    </svg>
  );
}

// AntuNexus — main shell: view switching + tweaks panel

const { useState: uS, useEffect: uE } = React;

function ProtoShell() {
  const [view, setView] = uS(() => localStorage.getItem("antu.view") || "system");
  const [activeApp, setActiveApp] = uS(() => localStorage.getItem("antu.app") || window.THEME.activeApp);
  const [mode, setMode] = uS(() => localStorage.getItem("antu.mode") || window.THEME.mode);
  const [tweaksOpen, setTweaksOpen] = uS(false);
  const [mobileScreen, setMobileScreen] = uS("hub");

  uE(() => { localStorage.setItem("antu.view", view); }, [view]);
  uE(() => { localStorage.setItem("antu.app", activeApp); }, [activeApp]);
  uE(() => {
    localStorage.setItem("antu.mode", mode);
    document.documentElement.setAttribute("data-mode", mode);
  }, [mode]);

  // Apply active app accent to root
  uE(() => {
    const a = APPS[activeApp];
    if (!a) return;
    const root = document.documentElement;
    root.style.setProperty("--accent", a.accent);
    root.style.setProperty("--accent-deep", a.accentDeep);
    root.style.setProperty("--accent-soft", a.accentSoft);
    root.style.setProperty("--accent-ink", a.accentInk);
  }, [activeApp, mode]);

  // Tweaks protocol
  uE(() => {
    const handler = (e) => {
      if (e.data?.type === "__activate_edit_mode") setTweaksOpen(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);
  }, []);

  const setTheme = (updates) => {
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: updates }, "*");
  };

  return (
    <div className="proto-canvas">
      <div className="proto-head">
        <div className="proto-head-left">
          <AntuLogo size={26}/>
          <div>
            <span className="eyebrow">AntuNexus · Prototipo v0.1</span>
            <h1 className="serif" style={{ fontSize: 26, letterSpacing: "-0.02em", lineHeight: 1 }}>
              Un sistema, muchos colores.
            </h1>
          </div>
        </div>
        <div className="proto-head-right">
          <div className="proto-nav">
            <button className={view === "system" ? "active" : ""} onClick={() => setView("system")}>Sistema</button>
            <button className={view === "responsive" ? "active" : ""} onClick={() => setView("responsive")}>Responsive</button>
            <button className={view === "flow" ? "active" : ""} onClick={() => setView("flow")}>Flujo mobile</button>
          </div>
        </div>
      </div>

      {view === "system" && <DSShowcase/>}
      {view === "responsive" && <ResponsiveView activeApp={activeApp}/>}
      {view === "flow" && <FlowView screen={mobileScreen} onScreen={setMobileScreen}/>}

      {tweaksOpen && (
        <TweaksPanel
          activeApp={activeApp}
          setActiveApp={(k) => { setActiveApp(k); setTheme({ activeApp: k }); }}
          mode={mode}
          setMode={(m) => { setMode(m); setTheme({ mode: m }); }}
          view={view}
          setView={setView}
        />
      )}
    </div>
  );
}
