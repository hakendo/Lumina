# Pipeline de build + deploy de Lumina a producción.
#
# La VM de producción NO tiene salida a internet, así que el agente de
# Azure Pipelines NO puede vivir ahí (necesita alcanzar dev.azure.com).
# El agente corre instalado nativo (sin Docker — pwsh/WinRM no andan bien
# desde un container Linux sin trabajo extra) en una PC con internet y
# línea de red hacia la VM, registrado como servicio Windows corriendo
# BAJO LA CUENTA de quien ya tiene WinRM confiado hacia la VM (no la
# cuenta default del servicio) — así no hace falta credencial explícita
# en los pasos de abajo, igual que se usó a mano toda la sesión.
#
# Requisitos antes de que esto corra (ver REQUISITOS-SERVIDOR-PRODUCCION.md):
#   1. VM de producción aprovisionada (Windows Server, IIS+ARR, Node, Postgres, NSSM).
#   2. Agente self-hosted registrado en el pool de `pool.name` abajo (config.cmd,
#      instalación nativa, servicio corriendo bajo la cuenta con WinRM confiado).
#   3. Prisma CLI disponible en la VM (se instala solo, es devDependency del backend).
#   4. apps/backend/.env ya existe en la VM con DATABASE_URL, JWT_SECRET,
#      ENCRYPTION_KEY, FRONTEND_URL — este pipeline NUNCA toca ese archivo.
#
# Ajustar `targetVm`, `deployRoot`, `healthUrl` a los valores reales.

trigger:
  branches:
    include:
      - master

pool:
  name: 'local-deploy-agent'

variables:
  targetVm: '192.168.180.155'                                # VM de Staging
  deployRoot: 'C:\inetpub\lumina'                            # TODO: confirmar ruta real en la VM (asumo igual a QA)
  backendServiceName: 'lumina-backend'                       # nombre del servicio NSSM en la VM
  healthUrl: 'http://192.168.180.155:8090/health'            # TODO: confirmar puerto real (asumo igual a QA, 8090)

stages:
  - stage: BuildAndDeploy
    displayName: 'Build (agente) + Deploy (VM sin internet vía WinRM)'
    jobs:
      - job: Deploy
        displayName: 'Build local, deploy remoto por WinRM'
        steps:
          - checkout: self
            displayName: 'Checkout del repo'
            fetchDepth: 2   # necesario para poder diffear contra el commit anterior (gate de CHANGELOG)

          - powershell: |
              $changed = git diff --name-only HEAD~1 HEAD
              if ($changed -notcontains 'CHANGELOG.md') {
                throw "CHANGELOG.md no fue modificado en este commit/PR. Agregá una entrada antes de deployar."
              }
              Write-Host "CHANGELOG.md actualizado, OK."
            displayName: 'Gate: CHANGELOG.md actualizado'
            workingDirectory: '$(Build.SourcesDirectory)'

          # Gate de tests — DESACTIVADO a propósito: hoy el repo no tiene
          # tests configurados (ver CLAUDE.md). Activar esto bloquearía
          # todos los deploys hasta que exista una suite real. Cuando haya
          # tests, descomentar y ajustar el comando (`pnpm test`, etc).
          # - powershell: |
          #     pnpm test
          #     if ($LASTEXITCODE -ne 0) { throw "Tests fallaron — deploy bloqueado" }
          #   displayName: 'Gate: tests automatizados'
          #   workingDirectory: '$(Build.SourcesDirectory)'

          - powershell: |
              node --version
              pnpm --version
              Test-WSMan -ComputerName '$(targetVm)'
            displayName: 'Verificar Node/pnpm locales y WinRM hacia la VM'

          - powershell: |
              pnpm install --frozen-lockfile
            displayName: 'Instalar dependencias (agente, ambos workspaces)'
            workingDirectory: '$(Build.SourcesDirectory)'
            env:
              PUPPETEER_SKIP_DOWNLOAD: 'true'
              NODE_TLS_REJECT_UNAUTHORIZED: '0'

          - powershell: |
              pnpm --filter lumina-frontend run build
            displayName: 'Build del frontend (Vite, en el agente)'
            workingDirectory: '$(Build.SourcesDirectory)'

          - powershell: |
              # Solo valida que el schema es correcto antes de tocar la VM —
              # el client que realmente importa se genera más abajo, EN la VM.
              pnpm --filter lumina-backend exec prisma generate
            displayName: 'Validar schema de Prisma (sanity check local)'
            workingDirectory: '$(Build.SourcesDirectory)'
            env:
              NODE_TLS_REJECT_UNAUTHORIZED: '0'

          - powershell: |
              $deployRoot = '$(deployRoot)'
              $svc = '$(backendServiceName)'

              $session = New-PSSession -ComputerName '$(targetVm)'
              try {
                # 1. Backup de la versión actual
                Invoke-Command -Session $session -ScriptBlock {
                  param($deployRoot)
                  $ts = Get-Date -Format "yyyyMMddHHmmss"
                  $backupDir = "$deployRoot\_backups\deploy-$ts"
                  New-Item -ItemType Directory -Path $backupDir -Force | Out-Null
                  if (Test-Path "$deployRoot\apps\frontend\dist") {
                    Copy-Item "$deployRoot\apps\frontend\dist" "$backupDir\dist" -Recurse
                  }
                  if (Test-Path "$deployRoot\apps\backend\src") {
                    Copy-Item "$deployRoot\apps\backend\src" "$backupDir\src" -Recurse
                  }
                  Write-Output "Backup en $backupDir"
                } -ArgumentList $deployRoot

                # 2. Detener el servicio backend
                Invoke-Command -Session $session -ScriptBlock {
                  param($svc)
                  Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
                } -ArgumentList $svc

                # 3. Copiar build + backend (reemplazo completo, no Copy-Item anidado —
                #    ver comentario del incidente de QA en REQUISITOS-SERVIDOR-PRODUCCION.md)
                Invoke-Command -Session $session -ScriptBlock {
                  param($deployRoot)
                  Remove-Item "$deployRoot\apps\frontend\dist" -Recurse -Force -ErrorAction SilentlyContinue
                  Remove-Item "$deployRoot\apps\backend\src" -Recurse -Force -ErrorAction SilentlyContinue
                  Remove-Item "$deployRoot\apps\backend\prisma" -Recurse -Force -ErrorAction SilentlyContinue
                  New-Item -ItemType Directory -Path "$deployRoot\apps\frontend\dist" -Force | Out-Null
                  New-Item -ItemType Directory -Path "$deployRoot\apps\backend\src" -Force | Out-Null
                  New-Item -ItemType Directory -Path "$deployRoot\apps\backend\prisma" -Force | Out-Null
                } -ArgumentList $deployRoot

                Copy-Item "$(Build.SourcesDirectory)\apps\frontend\dist\*" "$deployRoot\apps\frontend\dist" -ToSession $session -Recurse -Force
                Copy-Item "$(Build.SourcesDirectory)\apps\backend\src\*" "$deployRoot\apps\backend\src" -ToSession $session -Recurse -Force
                Copy-Item "$(Build.SourcesDirectory)\apps\backend\prisma\*" "$deployRoot\apps\backend\prisma" -ToSession $session -Recurse -Force
                Copy-Item "$(Build.SourcesDirectory)\apps\backend\package.json" "$deployRoot\apps\backend\package.json" -ToSession $session -Force

                # 4. Instalar deps + generar Prisma Client + migrar, todo en la VM
                Invoke-Command -Session $session -ScriptBlock {
                  param($deployRoot)
                  Set-Location "$deployRoot\apps\backend"
                  # Sin --prod a propósito: Prisma CLI vive en devDependencies.
                  # PUPPETEER_SKIP_DOWNLOAD: el env: del step no cruza la sesión WinRM
                  # remota (es un proceso aparte en otra máquina) — hay que setearlo acá adentro.
                  $env:PUPPETEER_SKIP_DOWNLOAD = 'true'
                  $env:NODE_TLS_REJECT_UNAUTHORIZED = '0'
                  # Ruta completa, no confiar en PATH: una sesión WinRM nueva no
                  # siempre ve un cambio de PATH a nivel máquina recién hecho.
                  # 2>&1 | Out-String: PowerShell remoto trunca stderr nativo
                  # multilinea a un solo ErrorRecord (se pierde el mensaje real
                  # de node, solo queda la primera línea) — se captura como
                  # texto plano y se imprime entero antes de chequear el exit code.
                  $out = & C:\pnpm\pnpm.exe install --frozen-lockfile 2>&1 | Out-String
                  Write-Output $out
                  if ($LASTEXITCODE -ne 0) { throw "pnpm install fallo en la VM" }
                  $out = & C:\pnpm\pnpm.exe exec prisma generate 2>&1 | Out-String
                  Write-Output $out
                  if ($LASTEXITCODE -ne 0) { throw "prisma generate fallo en la VM" }
                  $out = & C:\pnpm\pnpm.exe exec prisma migrate deploy 2>&1 | Out-String
                  Write-Output $out
                  if ($LASTEXITCODE -ne 0) { throw "prisma migrate deploy fallo en la VM" }
                } -ArgumentList $deployRoot

                # 5. Iniciar el servicio backend
                Invoke-Command -Session $session -ScriptBlock {
                  param($svc)
                  Start-Service -Name $svc
                } -ArgumentList $svc
              } finally {
                Remove-PSSession $session
              }
            displayName: 'Deploy completo a la VM (WinRM, una sola sesión)'
            env:
              PUPPETEER_SKIP_DOWNLOAD: 'true'

          - powershell: |
              $ok = $false
              for ($i = 0; $i -lt 10; $i++) {
                Start-Sleep -Seconds 3
                try {
                  $r = Invoke-RestMethod -Uri '$(healthUrl)' -TimeoutSec 5
                  if ($r.ok -eq $true) { $ok = $true; break }
                } catch {}
              }
              if (-not $ok) { throw "Health check fallo tras el deploy — revisar logs del servicio en la VM" }
              Write-Host "Health check OK"
            displayName: 'Health check post-deploy (desde el agente hacia la VM)'
